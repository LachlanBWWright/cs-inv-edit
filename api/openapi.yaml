openapi: 3.0.3
info:
  title: CS Inventory Edit Local Agent API
  version: 0.1.0
  description: >-
    Contract for communication between the application shells and the local
    agent. Endpoints are added here as they migrate from the legacy handwritten
    contract.
servers:
  - url: http://127.0.0.1:7331
paths:
  /health:
    get:
      operationId: getHealth
      summary: Read local-agent health
      responses:
        "200":
          description: The local agent is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /inventory:
    get:
      operationId: getInventory
      summary: Read the current authoritative CS2 inventory snapshot
      responses:
        "200":
          description: Current inventory state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySnapshot"
  /inventory/refresh:
    post:
      operationId: refreshInventory
      summary: Refresh the authoritative CS2 inventory from the Game Coordinator
      responses:
        "200":
          description: Receipt for the refresh operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationReceipt"
  /armory:
    get:
      operationId: getArmory
      summary: Read the current CS2 Armory snapshot
      responses:
        "200":
          description: Current Armory state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArmorySnapshot"
  /armory/refresh:
    post:
      operationId: refreshArmory
      summary: Refresh CS2 Armory state from the Game Coordinator
      responses:
        "200":
          description: Receipt for the refresh operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationReceipt"
  /games/{game}/inventory:
    parameters:
      - $ref: "#/components/parameters/Game"
    get:
      operationId: getGameInventory
      responses:
        "200": { $ref: "#/components/responses/GameInventoryResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /games/{game}/inventory/refresh:
    parameters:
      - $ref: "#/components/parameters/Game"
    post:
      operationId: refreshGameInventory
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
        "403": { $ref: "#/components/responses/OperationReceiptResponse" }
  /games/tf2/features:
    get:
      operationId: getTf2Features
      responses:
        "200":
          description: TF2 Game Coordinator feature snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TF2FeatureSnapshot" }
  /games/cs2/features:
    get:
      operationId: getCs2Features
      responses:
        "200":
          description: CS2 Game Coordinator feature snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CS2FeatureSnapshot" }
  /steam-inventory-service/games:
    get:
      operationId: listSteamInventoryServiceGames
      responses:
        "200":
          description: Supported Steam Inventory Service games.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/SteamInventoryServiceGames" }
  /steam-inventory-service/{appID}:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      operationId: getSteamInventoryService
      responses:
        "200": { $ref: "#/components/responses/GameInventoryResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /steam-inventory-service/{appID}/refresh:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      operationId: refreshSteamInventoryService
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/OperationReceiptResponse" }
  /armory/redeem:
    post:
      operationId: redeemArmory
      requestBody: { $ref: "#/components/requestBodies/ArmoryRedeem" }
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
  /store:
    get:
      operationId: getStore
      responses:
        "200": { $ref: "#/components/responses/StoreSnapshotResponse" }
  /store/refresh:
    post:
      operationId: refreshStore
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
  /games/tf2/store:
    get:
      operationId: getTf2Store
      responses:
        "200": { $ref: "#/components/responses/StoreSnapshotResponse" }
  /games/tf2/store/refresh:
    post:
      operationId: refreshTf2Store
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
  /games/tf2/store/purchases:
    post:
      operationId: initializeTf2StorePurchase
      requestBody:
        { $ref: "#/components/requestBodies/InitializeStorePurchase" }
      responses:
        "200": { $ref: "#/components/responses/PurchaseSessionResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /store/purchases:
    post:
      operationId: initializeStorePurchase
      requestBody:
        { $ref: "#/components/requestBodies/InitializeStorePurchase" }
      responses:
        "200": { $ref: "#/components/responses/PurchaseSessionResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /store/purchases/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getStorePurchase
      responses:
        "200": { $ref: "#/components/responses/PurchaseSessionResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /store/purchases/{id}/reconcile:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: reconcileStorePurchase
      responses:
        "200": { $ref: "#/components/responses/PurchaseSessionResponse" }
  /trades:
    get:
      operationId: getTrades
      responses:
        "200": { $ref: "#/components/responses/TradesResponse" }
  /trades/refresh:
    post:
      operationId: refreshTrades
      responses:
        "200": { $ref: "#/components/responses/TradesResponse" }
  /trade-accounts:
    get:
      operationId: getTradeAccounts
      responses:
        "200": { $ref: "#/components/responses/TradeAccountsResponse" }
    post:
      operationId: refreshTradeAccounts
      parameters:
        - in: query
          name: steamId
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/TradeAccountsResponse" }
  /trades/offers:
    post:
      operationId: createTradeOffer
      requestBody: { $ref: "#/components/requestBodies/CreateTradeOffer" }
      responses:
        "200": { $ref: "#/components/responses/TradeMutationResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /trades/offers/{id}/accept:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: acceptTradeOffer
      responses:
        "200": { $ref: "#/components/responses/TradeMutationResponse" }
  /trades/offers/{id}/counter:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: counterTradeOffer
      requestBody: { $ref: "#/components/requestBodies/CreateTradeOffer" }
      responses:
        "200": { $ref: "#/components/responses/TradeMutationResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /market/preview:
    get:
      operationId: getMarketPreview
      parameters:
        - in: query
          name: marketName
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Related market item metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelatedItem" }
        "502": { $ref: "#/components/responses/ErrorResponse" }
  /operations:
    get:
      operationId: listOperations
      responses:
        "200":
          description: Recorded operation receipts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OperationReceipt" }
  /operations/:
    post:
      operationId: rejectMissingOperationType
      deprecated: true
      responses:
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /operations/{type}:
    parameters:
      - in: path
        name: type
        required: true
        schema: { type: string }
    post:
      operationId: submitOperation
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /events:
    get:
      operationId: listEvents
      responses:
        "200":
          description: Repeating operation-event snapshots when requested through Accept.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OperationEvent" }
            text/event-stream:
              schema: { type: string }
  /protocol-trace:
    get:
      operationId: getProtocolTrace
      parameters:
        - in: query
          name: after
          schema: { type: integer, format: uint64, minimum: 0 }
      responses:
        "200":
          description: Protocol trace entries after the requested cursor.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProtocolTraceEntry" }
  /settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Application settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsData" }
  /steam/status:
    get:
      operationId: getSteamStatus
      responses:
        "200": { $ref: "#/components/responses/ConnectionStatusResponse" }
  /steam/status/ws:
    get:
      operationId: watchSteamStatus
      summary: Stream Steam connection status changes over WebSocket
      x-websocket-message:
        $ref: "#/components/schemas/ConnectionStatus"
      responses:
        "101":
          description: WebSocket upgrade; each message is a ConnectionStatus JSON value.
  /steam/connect:
    post:
      operationId: connectSteam
      requestBody: { $ref: "#/components/requestBodies/SteamCredentials" }
      responses:
        "200": { $ref: "#/components/responses/ConnectionStatusResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /steam/qr:
    post:
      operationId: startSteamQr
      responses:
        "200": { $ref: "#/components/responses/ConnectionStatusResponse" }
  /steam/guard:
    post:
      operationId: submitSteamGuard
      requestBody: { $ref: "#/components/requestBodies/SteamGuard" }
      responses:
        "200": { $ref: "#/components/responses/ConnectionStatusResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
  /steam/disconnect:
    post:
      operationId: disconnectSteam
      responses:
        "200": { $ref: "#/components/responses/ConnectionStatusResponse" }
  /storage/load:
    post:
      operationId: loadStorage
      requestBody: { $ref: "#/components/requestBodies/StorageLoad" }
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
  /storage/move-in:
    post:
      operationId: moveIntoStorage
      requestBody: { $ref: "#/components/requestBodies/StorageMove" }
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
  /storage/move-out:
    post:
      operationId: moveOutOfStorage
      requestBody: { $ref: "#/components/requestBodies/StorageMove" }
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
  /containers/open:
    post:
      operationId: openContainer
      requestBody: { $ref: "#/components/requestBodies/OpenContainer" }
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
  /tradeups/preview:
    post:
      operationId: previewTradeUp
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
  /tradeups/execute:
    post:
      operationId: executeTradeUp
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
  /nametags/apply:
    post:
      operationId: applyNameTag
      requestBody: { $ref: "#/components/requestBodies/SetItemName" }
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
  /nametags/remove:
    post:
      operationId: removeNameTag
      requestBody: { $ref: "#/components/requestBodies/RemoveItemName" }
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
  /items/delete:
    post:
      operationId: deleteItem
      requestBody: { $ref: "#/components/requestBodies/DeleteItem" }
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
  /stattrak/swap:
    post:
      operationId: applyStatTrakSwap
      requestBody: { $ref: "#/components/requestBodies/ApplyStatTrakSwap" }
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
  /strange-parts/apply:
    post:
      operationId: applyStrangePart
      requestBody: { $ref: "#/components/requestBodies/ApplyStrangePart" }
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
  /items/use:
    post:
      operationId: useItem
      requestBody: { $ref: "#/components/requestBodies/UseItem" }
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
  /items/use-multiple:
    post:
      operationId: useMultipleItems
      requestBody: { $ref: "#/components/requestBodies/UseMultipleItems" }
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
  /tools/apply:
    post:
      operationId: applyToolToItem
      requestBody: { $ref: "#/components/requestBodies/ApplyToolToItem" }
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
  /tools/apply-base:
    post:
      operationId: applyToolToBaseItem
      requestBody: { $ref: "#/components/requestBodies/ApplyToolToBaseItem" }
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
  /gifts/send:
    post:
      operationId: sendGift
      requestBody: { $ref: "#/components/requestBodies/GiftItem" }
      responses:
        "200": { $ref: "#/components/responses/OperationReceiptResponse" }
components:
  parameters:
    Game:
      in: path
      name: game
      required: true
      schema: { type: string }
    AppID:
      in: path
      name: appID
      required: true
      schema: { type: integer, format: uint32, minimum: 1 }
    ID:
      in: path
      name: id
      required: true
      schema: { type: string }
  requestBodies:
    JsonObject:
      required: false
      content:
        application/json:
          schema: { $ref: "#/components/schemas/JsonObject" }
    InitializeStorePurchase:
      required: true
      content:
        application/json:
          schema:
            { $ref: "#/components/schemas/InitializeStorePurchaseRequest" }
    CreateTradeOffer:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CreateSteamTradeOfferRequest" }
    ArmoryRedeem:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ArmoryRedeemRequest" }
    OpenContainer:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OpenContainerRequest" }
    SetItemName:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SetItemNameRequest" }
    RemoveItemName:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ItemIDRequest" }
    DeleteItem:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ItemIDRequest" }
    ApplyStatTrakSwap:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApplyStatTrakSwapRequest" }
    ApplyStrangePart:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApplyStrangePartRequest" }
    UseItem:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UseItemRequest" }
    UseMultipleItems:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UseMultipleItemsRequest" }
    ApplyToolToItem:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApplyToolToItemRequest" }
    ApplyToolToBaseItem:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApplyToolToBaseItemRequest" }
    GiftItem:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GiftItemRequest" }
    SteamCredentials:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SteamCredentialsRequest" }
    SteamGuard:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SteamGuardRequest" }
    StorageLoad:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StorageLoadRequest" }
    StorageMove:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StorageMoveRequest" }
  responses:
    JsonResponse:
      description: Successful JSON response.
      content:
        application/json:
          schema: {}
    OperationReceiptResponse:
      description: Operation receipt.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OperationReceipt" }
    StoreSnapshotResponse:
      description: Store snapshot.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StoreSnapshot" }
    PurchaseSessionResponse:
      description: Store purchase session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PurchaseSession" }
    TradesResponse:
      description: Steam trade snapshot.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SteamTradesSnapshot" }
    TradeAccountsResponse:
      description: Account-scoped Steam trade snapshots.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SteamAccountTradesCollection" }
    TradeMutationResponse:
      description: Steam trade mutation result.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SteamTradeMutationResult" }
    ConnectionStatusResponse:
      description: Steam connection state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ConnectionStatus" }
    GameInventoryResponse:
      description: Economy inventory snapshot.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GameInventorySnapshot" }
    ErrorResponse:
      description: Request failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
        - time
      properties:
        status:
          type: string
          enum:
            - ok
            - error
        service:
          type: string
        version:
          type: string
        time:
          type: string
          format: date-time
    OperationState:
      type: string
      enum:
        - queued
        - validating
        - encoded
        - sent
        - awaiting_gc_confirmation
        - reconciling_inventory
        - completed
        - failed
        - blocked_by_feature_flag
        - requires_validation
        - requires_connection
    OperationReceipt:
      type: object
      additionalProperties: false
      required:
        - operationId
        - type
        - state
        - createdAt
      properties:
        operationId:
          type: string
        type:
          type: string
        state:
          $ref: "#/components/schemas/OperationState"
        createdAt:
          type: string
          format: date-time
        message:
          type: string
        result:
          $ref: "#/components/schemas/OperationResult"
    OperationResult:
      type: object
      additionalProperties: true
      properties:
        kind:
          type: string
          enum: [inventory_award, terminal_unsealed, terminal_offer]
        openedItem: { $ref: "#/components/schemas/InventoryItem" }
        terminalItemId: { type: string }
        terminalDefIndex: { type: integer, format: uint32, minimum: 0 }
        offerItemId: { type: string }
        offer: { $ref: "#/components/schemas/RelatedItem" }
        pointsRemaining: { type: integer, format: uint32, minimum: 0 }
        terminalOffer: { $ref: "#/components/schemas/TerminalOffer" }
        consumedItemId: { type: string }
        requestEMsg: { type: integer, format: uint32, minimum: 0 }
        requestMethod: { type: string }
        requestBodyHex: { type: string }
        confirmation: { type: string }
        responseEMsg: { type: integer, format: uint32, minimum: 0 }
        responseBodyHex: { type: string }
        beforeItemCount: { type: integer, minimum: 0 }
        afterItemCount: { type: integer, minimum: 0 }
        diagnostics:
          type: array
          items: { type: string }
    OperationEvent:
      type: object
      additionalProperties: false
      required: [operationId, type, state, createdAt]
      properties:
        operationId: { type: string }
        type: { type: string }
        state: { $ref: "#/components/schemas/OperationState" }
        message: { type: string }
        createdAt: { type: string, format: date-time }
    ProtocolTraceEntry:
      type: object
      additionalProperties: false
      required:
        [
          id,
          timestamp,
          direction,
          layer,
          emsg,
          name,
          protobuf,
          bodyBytes,
          bodyHex,
        ]
      properties:
        id: { type: integer, minimum: 0 }
        timestamp: { type: string, format: date-time }
        direction: { type: string, enum: [sent, received] }
        layer: { type: string }
        appId: { type: integer, format: uint32, minimum: 0 }
        emsg: { type: integer, format: uint32, minimum: 0 }
        name: { type: string }
        protobuf: { type: boolean }
        bodyBytes: { type: integer, minimum: 0 }
        bodyHex: { type: string }
        decoded: {}
        decodeError: { type: string }
    Sticker:
      type: object
      additionalProperties: false
      properties:
        slot:
          type: integer
          format: uint32
          minimum: 0
        stickerId:
          type: integer
          format: uint32
          minimum: 0
        wear:
          type: number
          format: double
    AppliedItem:
      type: object
      additionalProperties: false
      required:
        - kind
        - name
      properties:
        kind:
          type: string
          enum: [sticker, charm, patch]
        slot:
          type: integer
          format: uint32
          minimum: 0
        id:
          type: integer
          format: uint32
          minimum: 0
        name:
          type: string
        imageUrl:
          type: string
        wear:
          type: number
          format: double
    RelatedItem:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        defindex:
          type: integer
          format: uint32
          minimum: 0
        paintKit:
          type: integer
          format: uint32
          minimum: 0
        name:
          type: string
        marketName:
          type: string
        listingName:
          type: string
        kind:
          type: string
        rarity:
          type: string
        imageUrl:
          type: string
        inspectUrl:
          type: string
        price:
          type: string
        paintWear:
          type: number
          format: double
        wearMin:
          type: number
          format: double
        wearMax:
          type: number
          format: double
        items:
          type: array
          items:
            $ref: "#/components/schemas/RelatedItem"
    TerminalOffer:
      type: object
      additionalProperties: false
      required:
        - fauxItemId
        - item
      properties:
        fauxItemId:
          type: string
        generationTime:
          type: integer
          format: uint32
          minimum: 0
        purchasePrice:
          type: integer
          format: uint32
          minimum: 0
        item:
          $ref: "#/components/schemas/RelatedItem"
    ItemDebug:
      type: object
      additionalProperties: false
      required:
        - descriptionMatched
        - marketDescriptionUsed
      properties:
        gcId:
          type: string
