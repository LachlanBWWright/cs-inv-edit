name: ci

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Build shared shells
        run: npm run build

      - name: Upload web and desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cs-inv-edit-builds
          path: |
            dist
            dist-electron
